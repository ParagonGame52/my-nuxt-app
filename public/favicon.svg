<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Outer Rim Gold Gradient -->
    <linearGradient id="favRimGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Hub Gradient -->
    <linearGradient id="favHubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="favShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ── 1. Wheel Outer Rim Base ── -->
  <circle cx="32" cy="34" r="26" fill="#0B0F19" filter="url(#favShadow)" />
  <circle cx="32" cy="34" r="25" stroke="url(#favRimGold)" stroke-width="2.5" fill="none" />

  <!-- ── 2. Lucky Wheel 8 Slices (Exact Math Arc Center: 32, 34, R: 23) ── -->
  <!-- Slice 1 (Top-Right 1): Electric Blue -->
  <path d="M 32 34 L 32 11 A 23 23 0 0 1 48.26 17.74 Z" fill="#2563EB" />
  <!-- Slice 2 (Top-Right 2): Cyber Purple -->
  <path d="M 32 34 L 48.26 17.74 A 23 23 0 0 1 55 34 Z" fill="#7C3AED" />
  <!-- Slice 3 (Bottom-Right 1): Hot Magenta -->
  <path d="M 32 34 L 55 34 A 23 23 0 0 1 48.26 50.26 Z" fill="#EC4899" />
  <!-- Slice 4 (Bottom-Right 2): Sunset Orange -->
  <path d="M 32 34 L 48.26 50.26 A 23 23 0 0 1 32 57 Z" fill="#F97316" />
  <!-- Slice 5 (Bottom-Left 1): Emerald Green -->
  <path d="M 32 34 L 32 57 A 23 23 0 0 1 15.74 50.26 Z" fill="#10B981" />
  <!-- Slice 6 (Bottom-Left 2): Aqua Cyan -->
  <path d="M 32 34 L 15.74 50.26 A 23 23 0 0 1 9 34 Z" fill="#06B6D4" />
  <!-- Slice 7 (Top-Left 1): Royal Indigo -->
  <path d="M 32 34 L 9 34 A 23 23 0 0 1 15.74 17.74 Z" fill="#4F46E5" />
  <!-- Slice 8 (Top-Left 2): Neon Sky Blue -->
  <path d="M 32 34 L 15.74 17.74 A 23 23 0 0 1 32 11 Z" fill="#0EA5E9" />

  <!-- Spokes / Dividers -->
  <line x1="32" y1="34" x2="32" y2="11" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="48.26" y2="17.74" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="55" y2="34" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="48.26" y2="50.26" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="32" y2="57" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="15.74" y2="50.26" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="9" y2="34" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="34" x2="15.74" y2="17.74" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6" />

  <!-- Rim Pegs (Golden Dots) -->
  <circle cx="32" cy="11.5" r="1.3" fill="#FFFFFF" />
  <circle cx="47.9" cy="18.1" r="1.3" fill="#FFFFFF" />
  <circle cx="54.5" cy="34" r="1.3" fill="#FFFFFF" />
  <circle cx="47.9" cy="49.9" r="1.3" fill="#FFFFFF" />
  <circle cx="32" cy="56.5" r="1.3" fill="#FFFFFF" />
  <circle cx="16.1" cy="49.9" r="1.3" fill="#FFFFFF" />
  <circle cx="9.5" cy="34" r="1.3" fill="#FFFFFF" />
  <circle cx="16.1" cy="18.1" r="1.3" fill="#FFFFFF" />

  <!-- ── 3. Center Hub with Letter 'D' ── -->
  <circle cx="32" cy="34" r="12.5" fill="url(#favHubGrad)" stroke="url(#favRimGold)" stroke-width="2" />
  <text x="32" y="39.5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="-0.5">D</text>

  <!-- ── 4. Lucky Wheel Pointer at Top ── -->
  <path d="M 27.5 4 L 36.5 4 L 32 14 Z" fill="url(#favRimGold)" stroke="#0F172A" stroke-width="1" />
  <circle cx="32" cy="5" r="1.5" fill="#FFFFFF" />
</svg>
